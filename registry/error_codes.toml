# PrivChat 错误码单一权威源(machine-readable registry)
#
# 为什么需要它:错误码此前由 Rust enum、Rust CODE_* 常量、Kotlin const val、
# TypeScript case 分支各自手写,没有交叉校验 —— 结果 20900/20902 与
# 20920-20923 各自出现了 2~4 套语义(见 ERROR_CODE_SPEC §3.4.12)。
#
# 规则:
#   1. 新增错误码**必须**先登记在此;
#   2. 各语言常量由此生成或与此校验,**不得**手写数字字面量;
#   3. 段位一经分配不得跨域借用 —— "临时借用别人的段位"是历次碰撞的根因。

[[segment]]
range = "20900-20919"
domain = "sync-recovery"
owner = "privchat-protocol"
note = "privchat-sdk 的 resume 状态机按码分支,永久占用,不可迁移"

[[segment]]
range = "20920-20929"
domain = "bot-follow"
owner = "privchat-protocol"
note = "protocol 枚举已定义 BotNotFound/NotABot/BotDisabled/BotFollowRateLimited"

[[segment]]
range = "21400-21499"
domain = "mmo-battle"
owner = "module-mmorpg"
note = "见 MMO_BATTLE_PROTOCOL_SPEC §9"

[[segment]]
range = "21500-21519"
domain = "channel-transfer"
owner = "privchat-protocol"
note = "自 20900-20904 迁入,原值与 sync-recovery 碰撞"

[[segment]]
range = "21600-21699"
domain = "mmo-scene"
owner = "module-mmorpg"
note = "见 MMO_WORLD_SCENE_SPEC"

[[segment]]
range = "21700-21719"
domain = "server-event-dispatch"
owner = "neton-application-module-privchat"
note = "自 20920-20922 迁入,原值与 bot-follow 碰撞"

[[segment]]
range = "21800-21819"
domain = "bot-lifecycle"
owner = "neton-application-module-privchat"
note = "自 20920-20924 迁入;原注释自承'借用 transfer 业务段位'"

[[segment]]
range = "21900-21919"
domain = "game-transfer"
owner = "privchat-application-module-game"
note = "自 20403/20404(好友域)迁入,原值属 UserInBlacklist/FriendRequestExpired"

[[segment]]
range = "0-20899"
domain = "legacy-protocol"
owner = "privchat-protocol"
note = "既有通用码,由 ErrorCode 枚举定义"

[[segment]]
range = "21000-21099"
domain = "application-existing"
owner = "neton-application-module-privchat"
note = "System User 等既有 application 码"

[[segment]]
range = "30000-30999"
domain = "game-domain"
owner = "privchat-application-module-game"
note = "棋牌玩法自有错误码(GameErrorCode)"

