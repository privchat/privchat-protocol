# privchat-protocol 错误码:**只有 IM / 传输核心错误**。
#
# 这些码用于在 IM 层面排查通信问题(鉴权、频道、同步、投递)。
# application 类项目的业务问题**不需要 IM 来定义错误码** —— 它们由各业务
# 模块自持,`TransferResponse.code` 本来就是整数,SDK 与客户端原样透传。
#
# **全局段位分配不在本表**,在 privchat-docs/governance/error-codes/segments.toml
# —— 核心通信层不该承担全组织的段位治理,那会让它跟着每个业务模块演进。

[[segment]]
range = "20900-20919"
domain = "sync-recovery"
owner = "privchat-protocol"
note = "privchat-sdk 的 resume 状态机按码分支,永久占用,不可迁移"

[[segment]]
range = "20920-20929"
domain = "bot-follow"
owner = "privchat-protocol"
note = "protocol 枚举已定义 BotNotFound/NotABot/BotDisabled/BotFollowRateLimited"

[[segment]]
range = "0-20899"
domain = "legacy-protocol"
owner = "privchat-protocol"
note = "既有通用码,由 ErrorCode 枚举定义"

[[segment]]
range = "21500-21500"
domain = "channel-transfer"
owner = "privchat-protocol"
note = "仅 ChannelNotSubscribed:由 privchat-server 的投递路由产生,属核心"

