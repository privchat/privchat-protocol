[package]
name = "privchat-protocol"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["zoujiaqing <zoujiaqing@gmail.com>"]
homepage = "https://privchat.dev"
repository = "https://github.com/privchat/privchat-protocol"
description = "Protocol library for PrivChat IM — FlatBuffers wire format, message types, RPC routes, error codes, presence, and notifications"

[dependencies]
flatbuffers = "24.3"
base64 = "0.22"
num-bigint = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
# 附件密文格式（attachment_crypto）。放在 protocol 里是因为客户端封、服务端在首传时
# 验，两边必须是同一份实现——各写一份就等于把线上格式交给两处独立演进。
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"

[dev-dependencies]
base64 = "0.22"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "codec_perf"
harness = false

[[bench]]
name = "payload_perf"
harness = false
