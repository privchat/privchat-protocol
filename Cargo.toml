[package]
name = "privchat-protocol"
version = "0.2.0"
edition = "2021"
license = "Apache-2.0"
authors = ["zoujiaqing <zoujiaqing@gmail.com>"]
homepage = "https://privchat.dev"
repository = "https://github.com/privchat/privchat-protocol"
description = "Protocol library for PrivChat IM — FlatBuffers wire format, message types, RPC routes, error codes, presence, and notifications"

[dependencies]
flatbuffers = "24.3"
base64 = "0.22"
num-bigint = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "codec_perf"
harness = false

[[bench]]
name = "payload_perf"
harness = false
